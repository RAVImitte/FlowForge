flowforge:
  kafka:
    enabled: true
  outbox:
    publisher-enabled: true
    command-dispatch-enabled: true
  execution:
    dispatch-enabled: false
    require-active-dispatcher: true
  results:
    consumer-enabled: true
  leases:
    heartbeat-consumer-enabled: true
    reaper-enabled: true
  scheduling:
    enabled: true
  coordination:
    enabled: true
  concurrency:
    reconciliation-enabled: true
