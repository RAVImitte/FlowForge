spring:
  application:
    name: flowforge-control-plane
  datasource:
    url: ${FLOWFORGE_DB_URL:jdbc:postgresql://localhost:5432/flowforge}
    username: ${FLOWFORGE_DB_USERNAME:flowforge}
    password: ${FLOWFORGE_DB_PASSWORD:flowforge}
    hikari:
      maximum-pool-size: ${FLOWFORGE_DB_POOL_SIZE:10}
      connection-timeout: 3000
  flyway:
    validate-migration-naming: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: FlowForge
    phase: 2

flowforge:
  execution:
    dispatch-enabled: ${FLOWFORGE_DISPATCH_ENABLED:true}
    dispatch-interval-ms: ${FLOWFORGE_DISPATCH_INTERVAL_MS:250}
