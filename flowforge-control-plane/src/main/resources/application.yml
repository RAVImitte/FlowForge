spring:
  application:
    name: flowforge-control-plane
  lifecycle:
    timeout-per-shutdown-phase: ${FLOWFORGE_SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: ${FLOWFORGE_DB_URL:jdbc:postgresql://localhost:5432/flowforge}
    username: ${FLOWFORGE_DB_USERNAME:flowforge}
    password: ${FLOWFORGE_DB_PASSWORD:flowforge}
    hikari:
      maximum-pool-size: ${FLOWFORGE_DB_POOL_SIZE:10}
      connection-timeout: 3000
  data:
    redis:
      host: ${FLOWFORGE_REDIS_HOST:localhost}
      port: ${FLOWFORGE_REDIS_PORT:6379}
      password: ${FLOWFORGE_REDIS_PASSWORD:}
      connect-timeout: ${FLOWFORGE_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${FLOWFORGE_REDIS_COMMAND_TIMEOUT:2s}
      repositories:
        enabled: false
  flyway:
    validate-migration-naming: true
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${FLOWFORGE_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        allow.auto.create.topics: false
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    listener:
      ack-mode: manual_immediate
      observation-enabled: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    template:
      observation-enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  tracing:
    sampling:
      probability: ${FLOWFORGE_TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
    baggage:
      enabled: true
    export:
      otlp:
        enabled: ${FLOWFORGE_OTLP_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${FLOWFORGE_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      limits:
        max-attributes: ${FLOWFORGE_TRACE_MAX_ATTRIBUTES:64}
        max-attribute-value-length: ${FLOWFORGE_TRACE_MAX_ATTRIBUTE_VALUE_LENGTH:1024}
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${FLOWFORGE_PROMETHEUS_ENABLED:true}
        descriptions: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${FLOWFORGE_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true
  health:
    redis:
      enabled: ${FLOWFORGE_COORDINATION_ENABLED:false}

info:
  app:
    name: FlowForge
    phase: 8

flowforge:
  admission:
    workflow-start:
      max-in-flight: ${FLOWFORGE_WORKFLOW_START_MAX_IN_FLIGHT:8}
      retry-after: ${FLOWFORGE_WORKFLOW_START_RETRY_AFTER:1s}
  dlq-replay:
    transport-timeout: ${FLOWFORGE_DLQ_REPLAY_TRANSPORT_TIMEOUT:10s}
    claim-lease: ${FLOWFORGE_DLQ_REPLAY_CLAIM_LEASE:30s}
  audit:
    online-retention: ${FLOWFORGE_AUDIT_ONLINE_RETENTION:365d}
  security:
    enabled: ${FLOWFORGE_SECURITY_ENABLED:false}
    issuer-uri: ${FLOWFORGE_OIDC_ISSUER_URI:}
    jwk-set-uri: ${FLOWFORGE_OIDC_JWK_SET_URI:}
    roles-claim: ${FLOWFORGE_SECURITY_ROLES_CLAIM:roles}
    tenant-id-claim: ${FLOWFORGE_SECURITY_TENANT_ID_CLAIM:tenant_id}
    local-tenant-id: ${FLOWFORGE_LOCAL_TENANT_ID:local}
  kafka:
    enabled: ${FLOWFORGE_KAFKA_ENABLED:false}
    topics:
      partitions: ${FLOWFORGE_KAFKA_TOPIC_PARTITIONS:6}
      replication-factor: ${FLOWFORGE_KAFKA_TOPIC_REPLICATION_FACTOR:1}
    recovery:
      max-retries: ${FLOWFORGE_KAFKA_RECOVERY_MAX_RETRIES:2}
      initial-backoff: ${FLOWFORGE_KAFKA_RECOVERY_INITIAL_BACKOFF:250ms}
      backoff-multiplier: ${FLOWFORGE_KAFKA_RECOVERY_BACKOFF_MULTIPLIER:2.0}
      max-backoff: ${FLOWFORGE_KAFKA_RECOVERY_MAX_BACKOFF:2s}
      publish-timeout: ${FLOWFORGE_KAFKA_DLQ_PUBLISH_TIMEOUT:10s}
  outbox:
    publisher-enabled: ${FLOWFORGE_OUTBOX_PUBLISHER_ENABLED:false}
    command-dispatch-enabled: ${FLOWFORGE_OUTBOX_COMMAND_DISPATCH_ENABLED:false}
    batch-size: ${FLOWFORGE_OUTBOX_BATCH_SIZE:100}
    publish-concurrency: ${FLOWFORGE_OUTBOX_PUBLISH_CONCURRENCY:8}
    poll-interval-ms: ${FLOWFORGE_OUTBOX_POLL_INTERVAL_MS:250}
    command-dispatch-interval-ms: ${FLOWFORGE_OUTBOX_COMMAND_DISPATCH_INTERVAL_MS:250}
    lease-duration: ${FLOWFORGE_OUTBOX_LEASE_DURATION:30s}
    publish-timeout: ${FLOWFORGE_OUTBOX_PUBLISH_TIMEOUT:10s}
    instance-id: ${FLOWFORGE_INSTANCE_ID:${spring.application.name}-${random.uuid}}
  execution:
    dispatch-enabled: ${FLOWFORGE_DISPATCH_ENABLED:true}
    dispatch-interval-ms: ${FLOWFORGE_DISPATCH_INTERVAL_MS:250}
    require-active-dispatcher: false
  results:
    consumer-enabled: ${FLOWFORGE_RESULT_CONSUMER_ENABLED:false}
    consumer-group: ${FLOWFORGE_RESULT_CONSUMER_GROUP:flowforge-control-plane-results-v1}
    consumer-concurrency: ${FLOWFORGE_RESULT_CONSUMER_CONCURRENCY:3}
    enqueue-batch-size: ${FLOWFORGE_RESULT_ENQUEUE_BATCH_SIZE:1000}
    inline-dispatch-enabled: ${FLOWFORGE_RESULT_INLINE_DISPATCH_ENABLED:false}
  retries:
    scheduler-enabled: ${FLOWFORGE_RETRY_SCHEDULER_ENABLED:true}
    batch-size: ${FLOWFORGE_RETRY_BATCH_SIZE:100}
    poll-interval-ms: ${FLOWFORGE_RETRY_POLL_INTERVAL_MS:250}
  timeouts:
    reaper-enabled: ${FLOWFORGE_TIMEOUT_REAPER_ENABLED:true}
    batch-size: ${FLOWFORGE_TIMEOUT_BATCH_SIZE:100}
    poll-interval-ms: ${FLOWFORGE_TIMEOUT_POLL_INTERVAL_MS:250}
  leases:
    duration: ${FLOWFORGE_WORKER_LEASE_DURATION:30s}
    heartbeat-consumer-enabled: ${FLOWFORGE_HEARTBEAT_CONSUMER_ENABLED:false}
    heartbeat-consumer-group: ${FLOWFORGE_HEARTBEAT_CONSUMER_GROUP:flowforge-control-plane-heartbeats-v1}
    heartbeat-consumer-concurrency: ${FLOWFORGE_HEARTBEAT_CONSUMER_CONCURRENCY:2}
    reaper-enabled: ${FLOWFORGE_LEASE_REAPER_ENABLED:false}
    batch-size: ${FLOWFORGE_LEASE_REAPER_BATCH_SIZE:100}
    poll-interval-ms: ${FLOWFORGE_LEASE_REAPER_POLL_INTERVAL_MS:250}
  scheduling:
    enabled: ${FLOWFORGE_SCHEDULING_ENABLED:false}
    materialization-batch-size: ${FLOWFORGE_SCHEDULING_MATERIALIZATION_BATCH_SIZE:100}
    processing-batch-size: ${FLOWFORGE_SCHEDULING_PROCESSING_BATCH_SIZE:100}
    poll-interval-ms: ${FLOWFORGE_SCHEDULING_POLL_INTERVAL_MS:1000}
    lease-duration: ${FLOWFORGE_SCHEDULING_LEASE_DURATION:30s}
    retry-delay: ${FLOWFORGE_SCHEDULING_RETRY_DELAY:5s}
    misfire-threshold: ${FLOWFORGE_SCHEDULING_MISFIRE_THRESHOLD:1m}
    instance-id: ${FLOWFORGE_SCHEDULER_INSTANCE_ID:${spring.application.name}-${random.uuid}}
  coordination:
    enabled: ${FLOWFORGE_COORDINATION_ENABLED:false}
    namespace: ${FLOWFORGE_ENVIRONMENT:local}
    lease-duration: ${FLOWFORGE_COORDINATION_LEASE_DURATION:30s}
    ttl-padding: ${FLOWFORGE_COORDINATION_TTL_PADDING:2m}
  concurrency:
    lease-duration: ${FLOWFORGE_CONCURRENCY_LEASE_DURATION:30s}
    reconciliation-enabled: ${FLOWFORGE_CONCURRENCY_RECONCILIATION_ENABLED:false}
    reconciliation-batch-size: ${FLOWFORGE_CONCURRENCY_RECONCILIATION_BATCH_SIZE:200}
    reconciliation-interval-ms: ${FLOWFORGE_CONCURRENCY_RECONCILIATION_INTERVAL_MS:10000}
  rate-limits:
    mirror-ttl: ${FLOWFORGE_RATE_LIMIT_MIRROR_TTL:10m}
    schedule-fires:
      capacity: ${FLOWFORGE_SCHEDULE_RATE_CAPACITY:100}
      refill-tokens: ${FLOWFORGE_SCHEDULE_RATE_REFILL_TOKENS:100}
      refill-period: ${FLOWFORGE_SCHEDULE_RATE_REFILL_PERIOD:1s}
    task-dispatch:
      capacity: ${FLOWFORGE_DISPATCH_RATE_CAPACITY:200}
      refill-tokens: ${FLOWFORGE_DISPATCH_RATE_REFILL_TOKENS:200}
      refill-period: ${FLOWFORGE_DISPATCH_RATE_REFILL_PERIOD:1s}
  quotas:
    defaults:
      max-active-executions: ${FLOWFORGE_TENANT_MAX_ACTIVE_EXECUTIONS:10000}
      max-running-tasks: ${FLOWFORGE_TENANT_MAX_RUNNING_TASKS:10000}
      max-ready-tasks: ${FLOWFORGE_TENANT_MAX_READY_TASKS:10000}
  backpressure:
    max-pending-schedule-fires: ${FLOWFORGE_MAX_PENDING_SCHEDULE_FIRES:10000}
    max-ready-tasks-per-workflow: ${FLOWFORGE_MAX_READY_TASKS_PER_WORKFLOW:1000}
    retry-after: ${FLOWFORGE_ADMISSION_RETRY_AFTER:1s}
