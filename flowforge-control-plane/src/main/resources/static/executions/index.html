<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowForge — Executions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-gear-wide-connected brand-icon"></i> FlowForge
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Workflows</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/executions/index.html">Executions</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/workflow/create.html">
                            <i class="bi bi-plus-circle"></i> New Workflow
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <!-- Filter bar + table -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-play-circle"></i> Executions</span>
                <div class="d-flex align-items-center gap-2">
                    <select class="form-select form-select-sm" id="status-filter" style="width: auto;">
                        <option value="ALL">All Statuses</option>
                        <option value="PENDING">Pending</option>
                        <option value="RUNNING">Running</option>
                        <option value="CANCELLING">Cancelling</option>
                        <option value="SUCCEEDED">Succeeded</option>
                        <option value="FAILED">Failed</option>
                        <option value="CANCELLED">Cancelled</option>
                    </select>
                    <button class="btn btn-outline-secondary btn-sm" id="btn-refresh" title="Refresh">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" id="execution-table">
                        <thead class="table-light">
                            <tr>
                                <th>Execution ID</th>
                                <th>Workflow</th>
                                <th>Version</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Started</th>
                                <th>Finished</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="execution-tbody">
                            <tr>
                                <td colspan="8" class="text-center py-4">
                                    <div class="spinner-border spinner-border-sm text-primary"></div> Loading…
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer d-flex justify-content-between align-items-center">
                <span class="text-muted small" id="page-info">Page 1</span>
                <div class="btn-group btn-group-sm">
                    <button class="btn btn-outline-secondary" id="btn-prev" disabled>
                        <i class="bi bi-chevron-left"></i> Prev
                    </button>
                    <button class="btn btn-outline-secondary" id="btn-next">
                        Next <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script>
        let currentPage = 0;
        const pageSize = 20;
        let currentStatus = 'ALL';
        let autoRefreshTimer = null;

        async function loadExecutions(page) {
            try {
                const data = await FlowForgeAPI.listExecutions(page, pageSize, currentStatus);
                renderTable(data);
                updatePagination(page, data);
                currentPage = page;
                scheduleAutoRefresh(data);
            } catch (err) {
                FlowForgeUI.toast(err.message, 'danger');
                document.getElementById('execution-tbody').innerHTML = `
                    <tr><td colspan="8" class="text-center text-danger py-4">
                        <i class="bi bi-exclamation-triangle"></i> ${FlowForgeUI.escapeHtml(err.message)}
                    </td></tr>`;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('execution-tbody');
            const items = data.items || [];

            if (items.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="8">
                        <div class="empty-state">
                            <div class="empty-icon"><i class="bi bi-inbox"></i></div>
                            <p>No executions found${currentStatus !== 'ALL' ? ` with status "${currentStatus}"` : ''}.</p>
                            <a href="/" class="btn btn-primary">
                                <i class="bi bi-arrow-left"></i> Back to Workflows
                            </a>
                        </div>
                    </td></tr>`;
                return;
            }

            tbody.innerHTML = items.map(e => `
                <tr onclick="window.location.href='/execution/detail.html?id=${e.id}'">
                    <td><code class="text-primary">${FlowForgeUI.escapeHtml(e.id.substring(0, 8))}</code></td>
                    <td><code class="small">${FlowForgeUI.escapeHtml(e.workflowId.substring(0, 8))}</code></td>
                    <td><span class="badge bg-light text-dark">v${e.workflowVersion}</span></td>
                    <td>${FlowForgeUI.executionStatusBadge(e.status)}</td>
                    <td><small class="text-muted">${FlowForgeUI.formatDateTime(e.createdAt)}</small></td>
                    <td><small class="text-muted">${FlowForgeUI.formatDateTime(e.startedAt)}</small></td>
                    <td><small class="text-muted">${FlowForgeUI.formatDateTime(e.finishedAt)}</small></td>
                    <td class="text-end" onclick="event.stopPropagation()">
                        <a href="/execution/detail.html?id=${e.id}" class="btn btn-outline-primary btn-sm" title="View Details">
                            <i class="bi bi-eye"></i>
                        </a>
                    </td>
                </tr>`).join('');
        }

        function updatePagination(page, data) {
            const total = data.totalElements || 0;
            const totalPages = data.totalPages || 1;
            document.getElementById('page-info').textContent = `Page ${page + 1} of ${totalPages} (${total} total)`;
            document.getElementById('btn-prev').disabled = page === 0;
            document.getElementById('btn-next').disabled = page + 1 >= totalPages;
        }

        function scheduleAutoRefresh(data) {
            if (autoRefreshTimer) clearTimeout(autoRefreshTimer);
            const items = data.items || [];
            const hasActive = items.some(e => e.status === 'PENDING' || e.status === 'RUNNING' || e.status === 'CANCELLING');
            if (hasActive) {
                autoRefreshTimer = setTimeout(() => loadExecutions(currentPage), 3000);
            }
        }

        document.getElementById('status-filter').addEventListener('change', (e) => {
            currentStatus = e.target.value;
            loadExecutions(0);
        });

        document.getElementById('btn-refresh').addEventListener('click', () => {
            loadExecutions(currentPage);
        });

        document.getElementById('btn-prev').addEventListener('click', () => {
            if (currentPage > 0) loadExecutions(currentPage - 1);
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            loadExecutions(currentPage + 1);
        });

        // Initial load
        loadExecutions(0);
    </script>
</body>
</html>
