apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowforge.fullname" . }}-control-plane
  labels:
    {{- include "flowforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  {{- if not .Values.controlPlane.autoscaling.enabled }}
  replicas: {{ .Values.controlPlane.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "flowforge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        {{- include "flowforge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
      {{- if or .Values.global.rotationToken .Values.controlPlane.podAnnotations }}
      annotations:
        {{- if .Values.global.rotationToken }}
        flowforge.io/rotation-token: {{ .Values.global.rotationToken | quote }}
        {{- end }}
        {{- with .Values.controlPlane.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "flowforge.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.controlPlane.terminationGracePeriodSeconds }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "flowforge.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: control-plane
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "flowforge.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: control-plane
      containers:
        - name: control-plane
          image: {{ include "flowforge.image" (list . .Values.controlPlane.image) | quote }}
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: production
            - name: FLOWFORGE_ENVIRONMENT
              value: {{ .Values.global.environment | quote }}
            - name: FLOWFORGE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: FLOWFORGE_SCHEDULER_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: FLOWFORGE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "secretRefs.database.name is required" .Values.secretRefs.database.name }}
                  key: {{ required "secretRefs.database.urlKey is required" .Values.secretRefs.database.urlKey }}
            - name: FLOWFORGE_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRefs.database.name }}
                  key: {{ required "secretRefs.database.usernameKey is required" .Values.secretRefs.database.usernameKey }}
            - name: FLOWFORGE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRefs.database.name }}
                  key: {{ required "secretRefs.database.passwordKey is required" .Values.secretRefs.database.passwordKey }}
            - name: FLOWFORGE_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: {{ required "secretRefs.kafka.name is required" .Values.secretRefs.kafka.name }}
                  key: {{ required "secretRefs.kafka.bootstrapServersKey is required" .Values.secretRefs.kafka.bootstrapServersKey }}
            - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRefs.kafka.name }}
                  key: {{ required "secretRefs.kafka.securityProtocolKey is required" .Values.secretRefs.kafka.securityProtocolKey }}
            - name: SPRING_KAFKA_PROPERTIES_SASL_MECHANISM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRefs.kafka.name }}
                  key: {{ required "secretRefs.kafka.saslMechanismKey is required" .Values.secretRefs.kafka.saslMechanismKey }}
            - name: SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRefs.kafka.name }}
                  key: {{ required "secretRefs.kafka.saslJaasConfigKey is required" .Values.secretRefs.kafka.saslJaasConfigKey }}
            - name: FLOWFORGE_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ required "secretRefs.redis.name is required" .Values.secretRefs.redis.name }}
                  key: {{ required "secretRefs.redis.hostKey is required" .Values.secretRefs.redis.hostKey }}
            - name: FLOWFORGE_REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRefs.redis.name }}
                  key: {{ required "secretRefs.redis.portKey is required" .Values.secretRefs.redis.portKey }}
            - name: FLOWFORGE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRefs.redis.name }}
                  key: {{ required "secretRefs.redis.passwordKey is required" .Values.secretRefs.redis.passwordKey }}
            - name: FLOWFORGE_OIDC_ISSUER_URI
              valueFrom:
                secretKeyRef:
                  name: {{ required "secretRefs.oidc.name is required" .Values.secretRefs.oidc.name }}
                  key: {{ required "secretRefs.oidc.issuerUriKey is required" .Values.secretRefs.oidc.issuerUriKey }}
            - name: FLOWFORGE_OIDC_JWK_SET_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRefs.oidc.name }}
                  key: {{ required "secretRefs.oidc.jwkSetUriKey is required" .Values.secretRefs.oidc.jwkSetUriKey }}
            {{- if .Values.trustStore.enabled }}
            - name: FLOWFORGE_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "trustStore.secretName is required when trustStore.enabled" .Values.trustStore.secretName }}
                  key: {{ required "trustStore.passwordKey is required when trustStore.enabled" .Values.trustStore.passwordKey }}
            {{- end }}
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75.0 -Djava.io.tmpdir=/tmp{{ if .Values.trustStore.enabled }} -Djavax.net.ssl.trustStore={{ .Values.trustStore.mountPath }}/truststore.p12 -Djavax.net.ssl.trustStorePassword=$(FLOWFORGE_TRUSTSTORE_PASSWORD){{ end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.trustStore.enabled }}
            - name: truststore
              mountPath: {{ .Values.trustStore.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if .Values.trustStore.enabled }}
        - name: truststore
          secret:
            secretName: {{ .Values.trustStore.secretName }}
            defaultMode: 0440
            items:
              - key: {{ required "trustStore.fileKey is required when trustStore.enabled" .Values.trustStore.fileKey }}
                path: truststore.p12
        {{- end }}
