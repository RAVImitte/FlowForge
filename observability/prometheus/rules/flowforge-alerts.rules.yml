groups:
  - name: flowforge-slo-alerts
    interval: 30s
    limit: 1000
    rules:
      - alert: FlowForgeApiAvailabilityFastBurn
        expr: |
          (flowforge:sli_api_error:ratio_rate1h > 14.4 * 0.001
            and flowforge:sli_api_error:ratio_rate5m > 14.4 * 0.001)
          or
          (flowforge:sli_api_error:ratio_rate6h > 6 * 0.001
            and flowforge:sli_api_error:ratio_rate30m > 6 * 0.001)
        for: 2m
        labels:
          severity: page
          service: flowforge-control-plane
          slo: api-availability
        annotations:
          summary: FlowForge API availability is consuming error budget rapidly
          description: "Environment {{ $labels.environment }} is burning the 99.9% API availability budget at a paging rate."
          action: Check control-plane errors and dependency health, then stop unsafe traffic if the burn continues.
          runbook_url: https://github.com/RAVImitte/FlowForge/blob/main/docs/operations/phase-6-slo-alerting-runbook.md#api-availability

      - alert: FlowForgeApiAvailabilityBudgetRisk
        expr: |
          (flowforge:sli_api_error:ratio_rate24h > 3 * 0.001
            and flowforge:sli_api_error:ratio_rate2h > 3 * 0.001)
          or
          (flowforge:sli_api_error:ratio_rate3d > 0.001
            and flowforge:sli_api_error:ratio_rate6h > 0.001)
        for: 15m
        labels:
          severity: ticket
          service: flowforge-control-plane
          slo: api-availability
        annotations:
          summary: FlowForge API availability budget is at risk
          description: "Environment {{ $labels.environment }} has a sustained API availability error-budget burn."
          action: Review the slow-burn error mix and schedule remediation before the 30-day budget is exhausted.
          runbook_url: https://github.com/RAVImitte/FlowForge/blob/main/docs/operations/phase-6-slo-alerting-runbook.md#api-availability

      - alert: FlowForgeWorkflowStartLatencyFastBurn
        expr: |
          (flowforge:sli_workflow_start_slow:ratio_rate1h > 14.4 * 0.01
            and flowforge:sli_workflow_start_slow:ratio_rate5m > 14.4 * 0.01)
          or
          (flowforge:sli_workflow_start_slow:ratio_rate6h > 6 * 0.01
            and flowforge:sli_workflow_start_slow:ratio_rate30m > 6 * 0.01)
        for: 2m
        labels:
          severity: page
          service: flowforge-control-plane
          slo: workflow-start-latency
        annotations:
          summary: Workflow starts are consuming latency budget rapidly
          description: "Successful workflow starts in {{ $labels.environment }} are exceeding one second at a paging burn rate."
          action: Inspect request latency, database contention, admission pressure, and outbox health.
          runbook_url: https://github.com/RAVImitte/FlowForge/blob/main/docs/operations/phase-6-slo-alerting-runbook.md#workflow-start-latency

      - alert: FlowForgeWorkflowStartLatencyBudgetRisk
        expr: |
          (flowforge:sli_workflow_start_slow:ratio_rate24h > 3 * 0.01
            and flowforge:sli_workflow_start_slow:ratio_rate2h > 3 * 0.01)
          or
          (flowforge:sli_workflow_start_slow:ratio_rate3d > 0.01
            and flowforge:sli_workflow_start_slow:ratio_rate6h > 0.01)
        for: 15m
        labels:
          severity: ticket
          service: flowforge-control-plane
          slo: workflow-start-latency
        annotations:
          summary: Workflow-start latency budget is at risk
          description: "Environment {{ $labels.environment }} has a sustained workflow-start latency budget burn."
          action: Compare latency with database, admission, and outbox signals and plan capacity or query remediation.
          runbook_url: https://github.com/RAVImitte/FlowForge/blob/main/docs/operations/phase-6-slo-alerting-runbook.md#workflow-start-latency

      - alert: FlowForgeTaskQueueLatencyBreach
        expr: flowforge:sli_task_queue_oldest:seconds > 30
        for: 5m
        labels:
          severity: page
          service: flowforge-control-plane
          slo: task-queue-latency
        annotations:
          summary: A ready task has waited longer than the queue objective
          description: "The oldest ready task in {{ $labels.environment }} has exceeded 30 seconds for five minutes."
          action: Check workers, Kafka delivery, admission pressure, and execution permits before increasing capacity.
          runbook_url: https://github.com/RAVImitte/FlowForge/blob/main/docs/operations/phase-6-slo-alerting-runbook.md#task-queue-latency

      - alert: FlowForgeTerminalCompletionBreach
        expr: flowforge:sli_terminal_oldest_active:seconds > 900
        for: 5m
        labels:
          severity: page
          service: flowforge-control-plane
          slo: terminal-completion
        annotations:
          summary: An active workflow has exceeded the terminal-completion objective
          description: "The oldest active workflow in {{ $labels.environment }} has exceeded 15 minutes for five minutes."
          action: Trace the oldest active execution through task, retry, timeout, outbox, and worker signals.
          runbook_url: https://github.com/RAVImitte/FlowForge/blob/main/docs/operations/phase-6-slo-alerting-runbook.md#terminal-completion

  - name: flowforge-symptom-alerts
    interval: 30s
    limit: 1000
    rules:
      - alert: FlowForgeServiceTargetDown
        expr: up{job=~"flowforge-(control-plane|worker)"} == 0
        for: 2m
        labels:
          severity: page
          service: "{{ $labels.job }}"
        annotations:
          summary: A FlowForge service cannot be scraped
          description: "Prometheus cannot reach {{ $labels.job }} instance {{ $labels.instance }}."
          action: Confirm the process, port, network path, and dependency startup health before restarting it.
          runbook_url: https://github.com/RAVImitte/FlowForge/blob/main/docs/operations/phase-6-slo-alerting-runbook.md#dependency-or-service-loss

      - alert: FlowForgeControlPlaneOutboxStalled
        expr: flowforge_outbox_pending > 0 and flowforge_outbox_oldest_age_seconds > 60
        for: 5m
        labels:
          severity: page
          service: flowforge-control-plane
        annotations:
          summary: Control-plane events are stalled in the transactional outbox
          description: "Pending control-plane messages in {{ $labels.environment }} are older than 60 seconds."
          action: Check Kafka availability and outbox publisher errors; preserve rows and allow idempotent replay.
          runbook_url: https://github.com/RAVImitte/FlowForge/blob/main/docs/operations/phase-4-reliability-runbook.md

      - alert: FlowForgeWorkerResultOutboxStalled
        expr: flowforge_worker_results_pending > 0 and flowforge_worker_results_oldest_age_seconds > 60
        for: 5m
        labels:
          severity: page
          service: flowforge-worker
        annotations:
          summary: Worker results are stalled in the transactional outbox
          description: "Pending worker results in {{ $labels.environment }} are older than 60 seconds."
          action: Check Kafka availability and result publisher errors; do not delete durable pending records.
          runbook_url: https://github.com/RAVImitte/FlowForge/blob/main/docs/operations/phase-4-reliability-runbook.md

      - alert: FlowForgeScheduleBacklogAging
        expr: flowforge_schedules_pending > 0 and flowforge_schedules_pending_current_oldest_age_seconds > 60
        for: 5m
        labels:
          severity: warning
          service: flowforge-control-plane
        annotations:
          summary: Durable schedule triggers are falling behind
          description: "The oldest pending schedule trigger in {{ $labels.environment }} is older than 60 seconds."
          action: Check scheduler leadership, database locks, admission pressure, and schedule dispatch throughput.
          runbook_url: https://github.com/RAVImitte/FlowForge/blob/main/docs/operations/phase-5-scheduling-coordination-runbook.md

      - alert: FlowForgeRetryExhaustionSpike
        expr: sum by (environment) (increase(flowforge_retries_exhausted_total[15m])) > 0
        labels:
          severity: warning
          service: flowforge-control-plane
        annotations:
          summary: One or more task retries were exhausted
          description: "Retries were exhausted in {{ $labels.environment }} during the last 15 minutes."
          action: Inspect failed attempts and dependency errors, then replay only through supported idempotent paths.
          runbook_url: https://github.com/RAVImitte/FlowForge/blob/main/docs/operations/phase-4-reliability-runbook.md

      - alert: FlowForgeTaskTimeoutSpike
        expr: sum by (environment) (rate(flowforge_timeouts_tasks_total[10m])) > 0.1
        for: 5m
        labels:
          severity: warning
          service: flowforge-control-plane
        annotations:
          summary: Task timeouts are elevated
          description: "Task timeouts in {{ $labels.environment }} exceed 0.1 per second over ten minutes."
          action: Compare worker processing duration with task timeout policy and downstream dependency latency.
          runbook_url: https://github.com/RAVImitte/FlowForge/blob/main/docs/operations/phase-4-reliability-runbook.md

      - alert: FlowForgeDeadLetterTraffic
        expr: |
          sum by (environment) (increase(flowforge_tasks_dead_lettered_total[15m])) > 0
          or sum by (environment) (increase(flowforge_kafka_dlq_published_total[15m])) > 0
        labels:
          severity: warning
          service: flowforge
        annotations:
          summary: FlowForge produced dead-letter traffic
          description: "At least one application or transport message entered a dead-letter path in {{ $labels.environment }}."
          action: Classify the poison message, preserve its identifiers, fix the cause, and use the documented replay path.
          runbook_url: https://github.com/RAVImitte/FlowForge/blob/main/docs/operations/phase-4-reliability-runbook.md

      - alert: FlowForgeCoordinationPermitLeak
        expr: |
          sum by (environment) (flowforge_concurrency_permits_active)
          >
          (sum by (environment) (flowforge_executions_active)
            + sum by (environment) (flowforge_tasks_running))
        for: 10m
        labels:
          severity: warning
          service: flowforge-control-plane
        annotations:
          summary: Active coordination permits exceed active durable work
          description: "Permits in {{ $labels.environment }} have exceeded active workflows plus running tasks for ten minutes."
          action: Check permit expiry, fencing, and reconciler activity before manually changing coordination rows.
          runbook_url: https://github.com/RAVImitte/FlowForge/blob/main/docs/operations/phase-5-scheduling-coordination-runbook.md

      - alert: FlowForgeAdmissionSaturation
        expr: |
          sum by (environment) (increase(flowforge_admission_throttled_total[10m])) > 0
          or sum by (environment) (increase(flowforge_admission_saturated_total[10m])) > 0
          or sum by (environment) (increase(flowforge_admission_rejected_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
          service: flowforge-control-plane
        annotations:
          summary: FlowForge admission controls are actively limiting work
          description: "Admission throttling, saturation, or rejection persisted in {{ $labels.environment }}."
          action: Identify the constrained queue or permit scope and reduce intake before scaling the measured bottleneck.
          runbook_url: https://github.com/RAVImitte/FlowForge/blob/main/docs/operations/phase-5-scheduling-coordination-runbook.md

      - alert: FlowForgeRedisCoordinationFailures
        expr: sum by (environment) (increase(flowforge_coordination_redis_failures_total[10m])) > 0
        for: 2m
        labels:
          severity: warning
          service: flowforge-control-plane
        annotations:
          summary: Redis coordination operations are failing
          description: "Redis coordination failures occurred in {{ $labels.environment }} during the last ten minutes."
          action: Check Redis connectivity and verify PostgreSQL-backed correctness remains healthy while cache coordination degrades.
          runbook_url: https://github.com/RAVImitte/FlowForge/blob/main/docs/operations/phase-5-scheduling-coordination-runbook.md

      - alert: FlowForgePrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        for: 2m
        labels:
          severity: warning
          service: prometheus
        annotations:
          summary: Prometheus failed to evaluate FlowForge rules
          description: "Prometheus rule evaluation failures increased on {{ $labels.instance }}."
          action: Run promtool against the checked-in rules and inspect Prometheus rule evaluation errors.
          runbook_url: https://github.com/RAVImitte/FlowForge/blob/main/docs/operations/phase-6-slo-alerting-runbook.md#prometheus-rule-health
