name: Release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version without a leading v
        required: true
        type: string
      registry:
        description: OCI registry host, including an optional port
        required: true
        type: string
      image_namespace:
        description: Registry namespace for FlowForge images
        required: true
        default: flowforge
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.registry }}-${{ inputs.image_namespace }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-sign-publish:
    name: Verify, sign, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      REGISTRY: ${{ inputs.registry }}
      IMAGE_NAMESPACE: ${{ inputs.image_namespace }}
      CONTROL_PLANE_IMAGE: ${{ inputs.registry }}/${{ inputs.image_namespace }}/control-plane:${{ inputs.version }}
      WORKER_IMAGE: ${{ inputs.registry }}/${{ inputs.image_namespace }}/worker:${{ inputs.version }}
    steps:
      - name: Check out the release revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release inputs and revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          [[ "$REGISTRY" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]
          [[ "$IMAGE_NAMESPACE" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test -z "$(git status --porcelain)"
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify security and tenant boundaries
        shell: pwsh
        run: ./scripts/invoke-quality-gate.ps1 -Gate Security
      - name: Verify populated-schema upgrade and rollback compatibility
        shell: pwsh
        run: ./scripts/invoke-quality-gate.ps1 -Gate Upgrade
      - name: Verify PostgreSQL restore and ephemeral-state reconciliation
        shell: pwsh
        run: ./scripts/invoke-quality-gate.ps1 -Gate Recovery
      - name: Run complete verification reactor
        shell: pwsh
        run: ./scripts/invoke-quality-gate.ps1 -Gate Full
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.3
      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.35.8
      - name: Validate release manifests
        shell: pwsh
        run: ./scripts/invoke-quality-gate.ps1 -Gate Manifests
      - name: Run bounded distributed smoke test
        shell: pwsh
        run: ./scripts/run-load-topology.ps1 -Topology single-6p -Profile smoke -ResetData
      - name: Generate aggregate application SBOM
        shell: pwsh
        run: ./scripts/invoke-quality-gate.ps1 -Gate Sbom
      - name: Resolve reproducible build metadata
        id: metadata
        shell: bash
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate to the release registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push control-plane image
        id: control-plane
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/control-plane.Dockerfile
          push: true
          tags: ${{ env.CONTROL_PLANE_IMAGE }}
          provenance: mode=max
          sbom: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.source_date_epoch }}
            VERSION=${{ env.RELEASE_VERSION }}
            REVISION=${{ steps.metadata.outputs.revision }}
            SOURCE_URL=${{ steps.metadata.outputs.source_url }}
      - name: Build and push worker image
        id: worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: true
          tags: ${{ env.WORKER_IMAGE }}
          provenance: mode=max
          sbom: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.source_date_epoch }}
            VERSION=${{ env.RELEASE_VERSION }}
            REVISION=${{ steps.metadata.outputs.revision }}
            SOURCE_URL=${{ steps.metadata.outputs.source_url }}
      - name: Scan control-plane release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ env.CONTROL_PLANE_IMAGE }}@${{ steps.control-plane.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan worker release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ env.WORKER_IMAGE }}@${{ steps.worker.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate control-plane image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ env.CONTROL_PLANE_IMAGE }}@${{ steps.control-plane.outputs.digest }}
          format: cyclonedx
          output: target/sbom/control-plane-image.cdx.json
          exit-code: "0"
      - name: Generate worker image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ env.WORKER_IMAGE }}@${{ steps.worker.outputs.digest }}
          format: cyclonedx
          output: target/sbom/worker-image.cdx.json
          exit-code: "0"
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.6.5
      - name: Sign, attest, and verify immutable images
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          CONTROL_PLANE_DIGEST: ${{ steps.control-plane.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$COSIGN_PRIVATE_KEY"
          cosign public-key --key env://COSIGN_PRIVATE_KEY > target/cosign.pub
          for component in control-plane worker; do
            if [[ "$component" == "control-plane" ]]; then
              image="$CONTROL_PLANE_IMAGE@$CONTROL_PLANE_DIGEST"
            else
              image="$WORKER_IMAGE@$WORKER_DIGEST"
            fi
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$image"
            cosign attest --yes --key env://COSIGN_PRIVATE_KEY \
              --type cyclonedx --predicate "target/sbom/${component}-image.cdx.json" "$image"
            cosign verify --key target/cosign.pub "$image"
            cosign verify-attestation --key target/cosign.pub \
              --type cyclonedx "$image"
          done
